# fly.toml app configuration file generated for quantum-leaps-o1tszw on 2026-10-16T19:21:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quantum-leaps-o1tszw'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
